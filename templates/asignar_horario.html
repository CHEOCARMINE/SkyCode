<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignar Horario</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f4f4f9;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        label {
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="time"],
        select {
            margin-bottom: 20px;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
        }

        .checkbox-group label {
            margin-right: 20px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .flash-message {
            margin-top: 20px;
            padding: 10px;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
        }

        .flash-message.success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
    </style>
</head>
<body>
    <h2>Asignar Horario a una Materia</h2>

    <form id="horario-form" method="POST">
        <label for="crn">CRN de la materia:</label>
        <input type="text" name="crn" id="crn" required>

        <label for="salon">Salón:</label>
        <input type="text" name="salon" id="salon" required>

        <label for="dias">Días:</label>
        <div class="checkbox-group">
            <label><input type="checkbox" name="dias[]" value="Lunes"> Lunes</label>
            <label><input type="checkbox" name="dias[]" value="Martes"> Martes</label>
            <label><input type="checkbox" name="dias[]" value="Miércoles"> Miércoles</label>
            <label><input type="checkbox" name="dias[]" value="Jueves"> Jueves</label>
            <label><input type="checkbox" name="dias[]" value="Viernes"> Viernes</label>
        </div>

        <label for="hora_inicio">Hora de inicio:</label>
        <input type="time" name="hora_inicio" id="hora_inicio" required>

        <label for="hora_fin">Hora de fin:</label>
        <input type="time" name="hora_fin" id="hora_fin" required>

        <button type="submit">Asignar Horario</button>
    </form>

    <!-- Flash Messages (Ejemplo de mensaje de éxito o error) -->
    <div id="flash-message" class="flash-message" style="display: none;"></div>

    <script>
        document.getElementById('horario-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevenir el envío del formulario

            const crn = document.getElementById('crn').value;
            const salon = document.getElementById('salon').value;
            const dias = document.querySelectorAll('input[name="dias[]"]:checked');
            const horaInicio = document.getElementById('hora_inicio').value;
            const horaFin = document.getElementById('hora_fin').value;

            // Validación de que al menos un día esté seleccionado
            if (dias.length === 0) {
                showFlashMessage('Por favor selecciona al menos un día para la materia.', 'danger');
                return;
            }

            // Validación de horas
            if (horaInicio >= horaFin) {
                showFlashMessage('La hora de inicio debe ser menor que la hora de fin.', 'danger');
                return;
            }

            // Concatenar los días seleccionados
            const diasSeleccionados = Array.from(dias).map(dia => dia.value).join(', ');

            // Mostrar el mensaje de éxito
            showFlashMessage(`Horario asignado correctamente a la materia con CRN: ${crn} en los días: ${diasSeleccionados} en el salón: ${salon}`, 'success');

           
        });

        function showFlashMessage(message, category) {
            const flashMessage = document.getElementById('flash-message');
            flashMessage.style.display = 'block';
            flashMessage.classList.remove('danger', 'success');
            flashMessage.classList.add(category);
            flashMessage.textContent = message;
        }
    </script>
</body>
</html>
