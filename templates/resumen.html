<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Inscripción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h1 class="text-center mb-4">Resumen de Inscripción</h1>

    {% if materia %}
        <ul class="list-group mb-4">
            <li class="list-group-item">
                Materia: {{ materia.nombre }} <br>
                CRN: {{ materia.crn }} <br>
                Código: {{ materia.codigo }} <br>
                Créditos: {{ materia.creditos }} 
            </li>
        </ul>
        <form action="/confirmar" method="post">
            <button type="submit" class="btn btn-success">Confirmar Inscripción</button>
        </form>
    {% else %}
        <p class="text-center text-danger">No se encontró ninguna materia con el CRN ingresado.</p>
        <a href="/" class="btn btn-primary">Intentar de nuevo</a>
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
