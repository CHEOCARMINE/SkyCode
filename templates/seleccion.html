<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar Materias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h1 class="text-center mb-4">Selecciona tus Materias</h1>

    <form action="/inscribir" method="post">
        <div class="mb-3">
            <label for="crn" class="form-label">Ingresa el CRN de la Materia:</label>
            <input type="text" class="form-control" id="crn" name="crn" required>
            <div class="form-text">Por favor, ingresa el CRN para la materia que deseas inscribir.</div>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-primary">Buscar Materia</button>
        </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
